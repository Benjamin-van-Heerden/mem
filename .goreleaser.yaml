version: 2
project_name: mem

builds:
  - id: mem
    main: ./cmd/mem
    binary: mem
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Benjamin-van-Heerden/mem/internal/buildinfo.Version={{ if .IsSnapshot }}dev{{ else }}{{ .Tag }}{{ end }} -X github.com/Benjamin-van-Heerden/mem/internal/buildinfo.Commit={{ .Commit }}

archives:
  - formats: [binary]
    name_template: "mem_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Benjamin-van-Heerden
    name: mem
  draft: false
