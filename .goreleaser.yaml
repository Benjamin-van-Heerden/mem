version: 2
project_name: memr

builds:
  - id: memr
    main: ./cmd/memr
    binary: memr
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Benjamin-van-Heerden/memr/internal/buildinfo.Version={{ if .IsSnapshot }}dev{{ else }}{{ .Tag }}{{ end }} -X github.com/Benjamin-van-Heerden/memr/internal/buildinfo.Commit={{ .Commit }}

archives:
  - formats: [binary]
    name_template: "memr_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Benjamin-van-Heerden
    name: memr
  draft: false
