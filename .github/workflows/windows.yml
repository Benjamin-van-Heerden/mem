name: Windows

# Windows starts processes so slowly that the Git-driven tests take minutes there, so this runs beside CI and never holds up a release.
on:
  push:
    branches: [test]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -parallel 8 ./...
